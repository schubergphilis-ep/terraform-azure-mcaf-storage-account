name: Provider Compatibility

# The module supports a range of azurerm provider majors (terraform.tf pins
# ">= 4, < 6"). The shared module CI only exercises the latest matching version,
# so this workflow runs the test suite against each supported major explicitly.
# The tests use mock_provider, so no cloud credentials are needed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  provider-matrix:
    name: terraform test (azurerm ${{ matrix.azurerm_major }}.x)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        azurerm_major: ["4", "5"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: terraform test against azurerm ${{ matrix.azurerm_major }}.x
        run: tests/provider-version-matrix.sh "${{ matrix.azurerm_major }}"
